version: '3.9'

services:
  api:
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wifisecure-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      SESSION_DATABASE_URL: ${SESSION_DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:?Set a unique SESSION_SECRET of at least 32 characters}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      WIFI_INGEST_TOKEN: ${WIFI_INGEST_TOKEN:-}
      UNIFI_API_BASE_URL: ${UNIFI_API_BASE_URL:-}
      UNIFI_API_KEY: ${UNIFI_API_KEY:-}
      UNIFI_SITE_ID: ${UNIFI_SITE_ID:-}
      UNIFI_CA_CERT_PATH: /app/apps/ingestor/certs/wifisecure-unifi-ca.pem
      UNIFI_INSECURE_TLS: ${UNIFI_INSECURE_TLS:-false}
    volumes:
      - ${UNIFI_CA_CERT_HOST_PATH:-./apps/ingestor/certs/wifisecure-unifi-ca.pem}:/app/apps/ingestor/certs/wifisecure-unifi-ca.pem:ro
    ports:
      - "127.0.0.1:4000:4000"

  ingestor:
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: apps/ingestor/Dockerfile
    container_name: wifisecure-ingestor
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      INGESTOR_INTERVAL_MS: ${INGESTOR_INTERVAL_MS:-15000}
      API_INTERNAL_URL: http://api:4000
      WIFI_INGEST_TOKEN: ${WIFI_INGEST_TOKEN:-}
      WIFI_ORGANIZATION_SLUG: ${WIFI_ORGANIZATION_SLUG:-legacy}
      UNIFI_MODE: ${UNIFI_MODE:-http}
      UNIFI_BASE_URL: ${UNIFI_BASE_URL:-${UNIFI_API_BASE_URL:-}}
      UNIFI_API_BASE_URL: ${UNIFI_API_BASE_URL:-}
      UNIFI_API_KEY: ${UNIFI_API_KEY:-}
      UNIFI_SITE_ID: ${UNIFI_SITE_ID:-}
      UNIFI_CA_CERT_PATH: /app/apps/ingestor/certs/wifisecure-unifi-ca.pem
      UNIFI_INSECURE_TLS: ${UNIFI_INSECURE_TLS:-false}
    volumes:
      - ${UNIFI_CA_CERT_HOST_PATH:-./apps/ingestor/certs/wifisecure-unifi-ca.pem}:/app/apps/ingestor/certs/wifisecure-unifi-ca.pem:ro

  web:
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    container_name: wifisecure-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
