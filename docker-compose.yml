version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wifisecure-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      SESSION_DATABASE_URL: ${SESSION_DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-super-secret-session-key-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "4000:4000"

  ingestor:
    build:
      context: .
      dockerfile: apps/ingestor/Dockerfile
    container_name: wifisecure-ingestor
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      INGESTOR_INTERVAL_MS: ${INGESTOR_INTERVAL_MS:-5000}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: wifisecure-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
